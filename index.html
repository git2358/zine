<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Photo Zine Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #2563eb;
            --text-color: #f3f4f6;
            --border-color: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Controls */
        #sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            background-color: #111827;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .sidebar-content {
            padding: 16px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #1f2937;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .control-group h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9ca3af;
        }

        label {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="number"], select, input[type="color"] {
            background: #374151;
            border: 1px solid #4b5563;
            color: #fff;
            padding: 6px 8px;
            border-radius: 4px;
            width: 55%;
        }

        input[type="range"] {
            width: 55%;
        }

        .inline-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            justify-content: flex-start;
        }

        .inline-label input[type="checkbox"] {
            width: auto;
        }

        /* Page Slot Assignment Panel */
        .page-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            background: #111827;
            padding: 8px;
            border-radius: 4px;
        }

        .page-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1f2937;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .page-item select {
            flex-grow: 1;
            width: auto;
        }

        /* Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button, .file-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            transition: background 0.2s;
        }

        button:hover, .file-btn:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            background-color: #4b5563;
        }

        input[type="file"].hidden-input {
            display: none;
        }

        /* Preview Workspace */
        #workspace {
            flex-grow: 1;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: auto;
        }

        #canvas-container {
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            background: #fff;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
                overflow: auto;
            }
            #sidebar {
                width: 100%;
                height: 50vh;
            }
            #workspace {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">Photo Zine Layout Studio</div>
        <div class="sidebar-content">

            <!-- Load Files & Projects -->
            <div class="control-group">
                <h3>1. Photos & Project</h3>
                <label class="file-btn">
                    📷 Upload Photos
                    <input type="file" id="imageInput" multiple accept="image/*" class="hidden-input">
                </label>
                <div class="btn-grid">
                    <label class="file-btn btn-secondary">
                        📥 Load JSON
                        <input type="file" id="jsonInput" accept=".json" class="hidden-input">
                    </label>
                    <button class="btn-secondary" onclick="exportJSON()">📤 Save JSON</button>
                </div>
            </div>

            <!-- Paper & Zine Formatting -->
            <div class="control-group">
                <h3>2. Paper & Orientation</h3>
                <label>Paper Size
                    <select id="paperSize" onchange="render()">
                        <option value="a4">A4 (297 × 210 mm)</option>
                        <option value="a3">A3 (420 × 297 mm)</option>
                        <option value="letter">US Letter (11 × 8.5 in)</option>
                        <option value="tabloid">US Tabloid (17 × 11 in)</option>
                    </select>
                </label>
                <label>Zine Fold Orientation
                    <select id="zineOrientation" onchange="render()">
                        <option value="portrait">Portrait Pages</option>
                        <option value="landscape">Landscape Pages</option>
                    </select>
                </label>
                <label>Page Count
                    <select id="pageCount" onchange="updatePageSlots(); render();">
                        <option value="8">8 Pages (1 Sheet)</option>
                    </select>
                </label>
            </div>

            <!-- Margins & Hassan Style Spine Offset -->
            <div class="control-group">
                <h3>3. Spacing & Spine Margins</h3>
                <label>Paper Background
                    <input type="color" id="bgColor" value="#ffffff" onchange="render()">
                </label>
                <label>Outer Margin: <span id="paddingVal">15</span>px
                    <input type="range" id="padding" min="0" max="60" value="15" oninput="document.getElementById('paddingVal').innerText=this.value; render()">
                </label>
                <label>Page Gap: <span id="spacingVal">10</span>px
                    <input type="range" id="spacing" min="0" max="40" value="10" oninput="document.getElementById('spacingVal').innerText=this.value; render()">
                </label>
                <label class="inline-label">
                    <input type="checkbox" id="enableSpine" checked onchange="render()">
                    <span>Enable Spine Fold Margins</span>
                </label>
                <label>Spine Width: <span id="spineVal">20</span>px
                    <input type="range" id="spineGap" min="0" max="80" value="20" oninput="document.getElementById('spineVal').innerText=this.value; render()">
                </label>
            </div>

            <!-- Sequence and Panoramas -->
            <div class="control-group">
                <h3>4. Sequence & Panoramic Spreads</h3>
                <p style="font-size: 0.75rem; color:#9ca3af;">Check "Panoramic Span" to merge adjacent facing pages into an uninterrupted double-page photo spread.</p>
                <div class="page-list" id="pageSlotContainer"></div>
            </div>

            <!-- Render/Exports -->
            <div class="control-group">
                <h3>5. Export Print Layout</h3>
                <div class="btn-grid">
                    <button onclick="exportImage('image/png')">Save PNG</button>
                    <button onclick="exportImage('image/tiff')">Save TIFF</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Live WYSIWYG Workspace -->
    <div id="workspace">
        <div id="canvas-container">
            <canvas id="zineCanvas"></canvas>
        </div>
    </div>

    <script>
        let uploadedImages = []; 
        let pageSlots = [];      

        const canvas = document.getElementById('zineCanvas');
        const ctx = canvas.getContext('2d');

        // Target Print Render Dimensions @ 300 DPI (Pixels)
        const paperDimensions = {
            'a4': { w: 3508, h: 2480 },
            'a3': { w: 4960, h: 3508 },
            'letter': { w: 3300, h: 2550 },
            'tabloid': { w: 5100, h: 3300 }
        };

        window.onload = () => {
            updatePageSlots();
            render();
        };

        document.getElementById('imageInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            let loadedCount = 0;

            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const imgObj = {
                            id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                            name: file.name,
                            src: event.target.result,
                            element: img
                        };
                        uploadedImages.push(imgObj);
                        loadedCount++;
                        if (loadedCount === files.length) {
                            autoAssignImages();
                            updatePageSlots();
                            render();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        function updatePageSlots() {
            const count = parseInt(document.getElementById('pageCount').value);
            const newSlots = [];

            for (let i = 1; i <= count; i++) {
                const existing = pageSlots.find(s => s.pageNum === i);
                newSlots.push(existing || {
                    pageNum: i,
                    imageId: uploadedImages[i - 1] ? uploadedImages[i - 1].id : 'none',
                    isPanoramaNext: false
                });
            }
            pageSlots = newSlots;
            renderPageSlotsUI();
        }

        function autoAssignImages() {
            pageSlots.forEach((slot, idx) => {
                if (uploadedImages[idx]) {
                    slot.imageId = uploadedImages[idx].id;
                }
            });
        }

        function renderPageSlotsUI() {
            const container = document.getElementById('pageSlotContainer');
            container.innerHTML = '';

            pageSlots.forEach((slot, index) => {
                const div = document.createElement('div');
                div.className = 'page-item';

                let labelText = `Pg ${slot.pageNum}`;
                if (slot.pageNum === 1) labelText += " (Front Cover)";
                if (slot.pageNum === pageSlots.length) labelText += " (Back Cover)";

                let options = `<option value="none">-- Blank --</option>`;
                uploadedImages.forEach(img => {
                    const sel = img.id === slot.imageId ? 'selected' : '';
                    options += `<option value="${img.id}" ${sel}>${img.name}</option>`;
                });

                const panChecked = slot.isPanoramaNext ? 'checked' : '';
                const hidePan = (index === pageSlots.length - 1) ? 'style="display:none;"' : '';

                div.innerHTML = `
                    <span style="width: 110px;">${labelText}</span>
                    <select onchange="assignImageToPage(${slot.pageNum}, this.value)">${options}</select>
                    <label class="inline-label" ${hidePan} title="Connect borderlessly with Page ${slot.pageNum + 1}">
                        <input type="checkbox" ${panChecked} onchange="togglePanorama(${slot.pageNum}, this.checked)"> Panoramic
                    </label>
                `;
                container.appendChild(div);
            });
        }

        function assignImageToPage(pageNum, imgId) {
            const slot = pageSlots.find(s => s.pageNum === pageNum);
            if (slot) slot.imageId = imgId;
            render();
        }

        function togglePanorama(pageNum, checked) {
            const slot = pageSlots.find(s => s.pageNum === pageNum);
            if (slot) slot.isPanoramaNext = checked;
            render();
        }

        // Core Layout & Rendering Engine
        function render() {
            const paperType = document.getElementById('paperSize').value;
            const dim = paperDimensions[paperType];
            
            canvas.width = dim.w;
            canvas.height = dim.h;

            const padding = parseInt(document.getElementById('padding').value) * 3;
            const spacing = parseInt(document.getElementById('spacing').value) * 2;
            const enableSpine = document.getElementById('enableSpine').checked;
            const spineGap = enableSpine ? parseInt(document.getElementById('spineGap').value) * 3 : 0;
            const bgColor = document.getElementById('bgColor').value;
            const zineOrientation = document.getElementById('zineOrientation').value;

            // Fill canvas background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Configure Grid Matrix based on Page Orientation
            let cols, rows, layoutGrid;

            if (zineOrientation === 'portrait') {
                // Portrait Zine: Paper divided into 2 Rows x 4 Columns
                cols = 4;
                rows = 2;
                
                // Standard 8-page Emon Hassan One-Sheet Fold Sequence
                // Top Row (Upside down relative to paper sheet orientation):
                // [ Page 8 (Back) ][ Page 1 (Front) ][ Page 6 ][ Page 5 ]
                // Bottom Row (Right side up):
                // [ Page 7        ][ Page 2         ][ Page 3 ][ Page 4 ]
                layoutGrid = [
                    { col: 0, row: 0, pageNum: 8, rotate: true },
                    { col: 1, row: 0, pageNum: 1, rotate: true },
                    { col: 2, row: 0, pageNum: 6, rotate: true },
                    { col: 3, row: 0, pageNum: 5, rotate: true },
                    { col: 0, row: 1, pageNum: 7, rotate: false },
                    { col: 1, row: 1, pageNum: 2, rotate: false },
                    { col: 2, row: 1, pageNum: 3, rotate: false },
                    { col: 3, row: 1, pageNum: 4, rotate: false }
                ];
            } else {
                // Landscape Zine: Paper divided into 4 Rows x 2 Columns
                cols = 2;
                rows = 4;

                // Landscape fold sequence map
                layoutGrid = [
                    { col: 0, row: 0, pageNum: 8, rotate: true },
                    { col: 1, row: 0, pageNum: 1, rotate: true },
                    { col: 0, row: 1, pageNum: 6, rotate: true },
                    { col: 1, row: 1, pageNum: 5, rotate: true },
                    { col: 0, row: 2, pageNum: 7, rotate: false },
                    { col: 1, row: 2, pageNum: 2, rotate: false },
                    { col: 0, row: 3, pageNum: 3, rotate: false },
                    { col: 1, row: 3, pageNum: 4, rotate: false }
                ];
            }

            drawFoldGuides(cols, rows);

            const cellWidth = (canvas.width - (padding * 2)) / cols;
            const cellHeight = (canvas.height - (padding * 2)) / rows;

            layoutGrid.forEach(cell => {
                const slot = pageSlots.find(s => s.pageNum === cell.pageNum);
                if (!slot) return;

                const imgObj = uploadedImages.find(i => i.id === slot.imageId);

                let x = padding + cell.col * cellWidth;
                let y = padding + cell.row * cellHeight;
                let w = cellWidth;
                let h = cellHeight;

                // Apply Hassan Spine Margins (Shifts margins inwards away from spine fold line)
                if (enableSpine) {
                    if (zineOrientation === 'portrait') {
                        if (cell.col % 2 === 0) {
                            x += spineGap;
                            w -= spineGap;
                        } else {
                            w -= spineGap;
                        }
                    } else {
                        if (cell.row % 2 === 0) {
                            y += spineGap;
                            h -= spineGap;
                        } else {
                            h -= spineGap;
                        }
                    }
                }

                // Check for Panoramic Span (Strips gap with adjacent facing page)
                let applyGapRight = true;
                let applyGapBottom = true;

                if (slot.isPanoramaNext) {
                    if (zineOrientation === 'portrait') applyGapRight = false;
                    else applyGapBottom = false;
                }

                const padGap = spacing / 2;
                x += padGap;
                y += padGap;
                w -= applyGapRight ? spacing : padGap;
                h -= applyGapBottom ? spacing : padGap;

                if (imgObj && imgObj.element) {
                    drawPageImage(ctx, imgObj.element, x, y, w, h, cell.rotate);
                }

                // Draw non-intrusive page label markers
                ctx.save();
                ctx.fillStyle = "rgba(120, 120, 120, 0.4)";
                ctx.font = "bold 22px sans-serif";
                ctx.fillText(`P.${cell.pageNum}`, x + 12, y + 28);
                ctx.restore();
            });
        }

        function drawPageImage(ctx, img, x, y, w, h, rotate180) {
            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            if (rotate180) {
                ctx.rotate(Math.PI);
            }

            // Perform proportional aspect-fill calculation
            const imgAspect = img.width / img.height;
            const cellAspect = w / h;
            let drawW, drawH;

            if (imgAspect > cellAspect) {
                drawH = h;
                drawW = h * imgAspect;
            } else {
                drawW = w;
                drawH = w / imgAspect;
            }

            ctx.beginPath();
            ctx.rect(-w / 2, -h / 2, w, h);
            ctx.clip();

            ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.restore();
        }

        function drawFoldGuides(cols, rows) {
            ctx.save();
            ctx.strokeStyle = "rgba(180, 180, 180, 0.35)";
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);

            // Draw Column dividers
            const colW = canvas.width / cols;
            for (let i = 1; i < cols; i++) {
                ctx.beginPath();
                ctx.moveTo(colW * i, 0);
                ctx.lineTo(colW * i, canvas.height);
                ctx.stroke();
            }

            // Draw Row dividers
            const rowH = canvas.height / rows;
            for (let j = 1; j < rows; j++) {
                ctx.beginPath();
                ctx.moveTo(0, rowH * j);
                ctx.lineTo(canvas.width, rowH * j);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Export Actions
        function exportImage(mimeType) {
            const link = document.createElement('a');
            const ext = mimeType === 'image/tiff' ? 'tiff' : 'png';
            link.download = `zine_sheet_${Date.now()}.${ext}`;
            link.href = canvas.toDataURL(mimeType);
            link.click();
        }

        function exportJSON() {
            const exportData = {
                paperSize: document.getElementById('paperSize').value,
                zineOrientation: document.getElementById('zineOrientation').value,
                pageCount: document.getElementById('pageCount').value,
                bgColor: document.getElementById('bgColor').value,
                padding: document.getElementById('padding').value,
                spacing: document.getElementById('spacing').value,
                enableSpine: document.getElementById('enableSpine').checked,
                spineGap: document.getElementById('spineGap').value,
                pageSlots: pageSlots
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `zine_config_${Date.now()}.json`);
            dlAnchor.click();
        }

        document.getElementById('jsonInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.paperSize) document.getElementById('paperSize').value = data.paperSize;
                    if (data.zineOrientation) document.getElementById('zineOrientation').value = data.zineOrientation;
                    if (data.pageCount) document.getElementById('pageCount').value = data.pageCount;
                    if (data.bgColor) document.getElementById('bgColor').value = data.bgColor;
                    if (data.padding) document.getElementById('padding').value = data.padding;
                    if (data.spacing) document.getElementById('spacing').value = data.spacing;
                    if (data.enableSpine !== undefined) document.getElementById('enableSpine').checked = data.enableSpine;
                    if (data.spineGap) document.getElementById('spineGap').value = data.spineGap;
                    if (data.pageSlots) pageSlots = data.pageSlots;

                    updatePageSlots();
                    render();
                } catch (err) {
                    alert("Invalid JSON configuration file.");
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
