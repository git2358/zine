<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Local Zine Imposer Studio</title>
<style>
:root {
  --bg: #121214; --panel: #1e1e22; --panel2: #28282e; --line: #383842;
  --text: #f0f0f5; --muted: #9a9ab0; --accent: #4f80ff; --accent-hover: #6692ff;
  --danger: #e5484d; --paper: #ffffff; --ink: #111111;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100vh; }
button, input, select { font: inherit; }
button { border: 1px solid var(--line); background: var(--panel2); color: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: all 0.15s ease; }
button:hover { background: #33333d; border-color: #555566; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent-hover); }
button.danger { background: rgba(229, 72, 77, 0.15); border-color: var(--danger); color: var(--danger); }
button.danger:hover { background: var(--danger); color: #fff; }
button.small { padding: 5px 8px; font-size: 0.8rem; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 100vh; }
.preview-area { min-width: 0; display: flex; flex-direction: column; background: #0b0b0c; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.topbar h1 { font-size: 1.1rem; margin: 0; font-weight: 600; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.view-modes { display: flex; background: var(--bg); padding: 3px; border-radius: 8px; border: 1px solid var(--line); }
.view-modes button { border: none; background: transparent; border-radius: 6px; padding: 5px 10px; font-size: 0.85rem; }
.view-modes button.active { background: var(--panel2); color: var(--accent); font-weight: 600; }
.preview-wrap { padding: 30px; overflow: auto; flex: 1; display: flex; justify-content: center; align-items: center; }
#paperPreview { position: relative; background: var(--paper); box-shadow: 0 12px 40px rgba(0,0,0,0.6); overflow: hidden; transition: transform 0.2s ease; }
.page { position: absolute; overflow: hidden; background: var(--page-bg, #fff); box-sizing: border-box; }
.page.flipped { transform: rotate(180deg); }
.page img { width: 100%; height: 100%; display: block; }
.page img.fit-cover { object-fit: cover; }
.page img.fit-contain { object-fit: contain; }
.page .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 11px; text-align: center; padding: 6px; border: 1px dashed #ccc; margin: 4px; }
.page .border-overlay { position: absolute; inset: 0; pointer-events: none; }
.page .label { position: absolute; left: 4px; top: 4px; font-size: 9px; font-weight: 700; color: #333; background: rgba(255,255,255,0.85); padding: 1px 4px; border-radius: 3px; z-index: 2; border: 1px solid #ddd; }
.foldline { position: absolute; z-index: 3; pointer-events: none; }
.foldline.v { top: 0; bottom: 0; border-left: 1px dashed #999; }
.foldline.h { left: 0; right: 0; border-top: 1px dashed #999; }
.cutline { position: absolute; z-index: 4; pointer-events: none; border-top: 2px solid #e5484d; }

.sidebar { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; }
.section { padding: 16px; border-bottom: 1px solid var(--line); }
.section h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { margin-bottom: 10px; }
.field label { display: block; color: var(--muted); font-size: 0.78rem; margin-bottom: 5px; }
.field input[type=text], .field input[type=number], .field select { width: 100%; background: var(--bg); color: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.field input[type=color] { width: 100%; height: 34px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px; cursor: pointer; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; color: var(--muted); background: rgba(0,0,0,0.15); transition: all 0.2s; }
.drop.drag { border-color: var(--accent); background: rgba(79, 128, 255, 0.1); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.page-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
.page-card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.page-card.drag-over { border-color: var(--accent); background: rgba(79, 128, 255, 0.05); }
.page-card .header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.page-card .thumb-box { height: 75px; background: #000; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #333; }
.page-card .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
.page-card select { font-size: 0.75rem; padding: 4px; }

.check { display: flex; gap: 8px; align-items: center; font-size: 0.82rem; margin: 8px 0; cursor: pointer; }
.help { font-size: 0.75rem; color: var(--muted); line-height: 1.4; margin-top: 4px; }
.status { font-size: 0.78rem; color: var(--muted); }

@media(max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { border-left: 0; border-top: 1px solid var(--line); }
  .preview-wrap { min-height: 450px; padding: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <main class="preview-area">
    <div class="topbar">
      <h1>Zine Studio</h1>
      <div class="view-modes">
        <button id="viewSheet" class="active">Sheet View</button>
        <button id="viewReader">Reader Spreads</button>
      </div>
      <div class="spacer"></div>
      <button id="printBtn" class="primary">Print / PDF</button>
    </div>
    <div class="preview-wrap">
      <div id="paperPreview"></div>
    </div>
  </main>

  <aside class="sidebar">
    <div class="section">
      <h2>1. Media Assets</h2>
      <div id="drop" class="drop">
        Drag & Drop Images<br><small>or</small><br>
        <button id="pickBtn" class="primary small" style="margin-top:6px">Select Files</button>
      </div>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
      <div class="actions" style="margin-top:10px">
        <button id="clearPhotos" class="small danger">Clear All</button>
        <button id="autoAssign" class="small">Auto-Assign</button>
      </div>
    </div>

    <div class="section">
      <h2>2. Paper & Layout</h2>
      <div class="grid2">
        <div class="field">
          <label>Paper Size</label>
          <select id="paper"><option value="A4">A4</option><option value="A3">A3</option><option value="US Letter">US Letter</option></select>
        </div>
        <div class="field">
          <label>Fit Mode</label>
          <select id="objectFit"><option value="cover">Cover (Crop)</option><option value="contain">Contain (Fit)</option></select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Outer Margin (mm)</label>
          <input id="margin" type="number" min="0" max="30" step="0.5" value="5">
        </div>
        <div class="field">
          <label>Page Gap (mm)</label>
          <input id="gap" type="number" min="0" max="10" step="0.5" value="0">
        </div>
      </div>
    </div>

    <div class="section">
      <h2>3. Styling & Guides</h2>
      <div class="grid2">
        <div class="field">
          <label>Border Width (mm)</label>
          <input id="borderWidth" type="number" min="0" max="5" step="0.1" value="0.3">
        </div>
        <div class="field">
          <label>Border Color</label>
          <input id="borderColor" type="color" value="#222222">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Page Background</label>
          <input id="pageBg" type="color" value="#ffffff">
        </div>
        <div class="field">
          <label>Guides</label>
          <select id="guides"><option value="yes">Show Cuts & Folds</option><option value="no">Hide Guides</option></select>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>4. Page Imposition</h2>
      <div class="help" style="margin-bottom:10px">Assign uploaded photos to logical reader pages. Top row auto-rotates for single-sheet folding.</div>
      <div id="pageGrid" class="page-grid"></div>
    </div>

    <div class="section">
      <h2>5. Export Project</h2>
      <div class="actions">
        <button id="pngBtn" class="primary">Export High-Res PNG</button>
        <button id="jsonOut">Save Project</button>
        <button id="jsonIn">Load Project</button>
        <input id="jsonInput" type="file" accept=".json" hidden>
      </div>
      <div id="status" class="status" style="margin-top:10px">Client-side rendering engine active.</div>
    </div>
  </aside>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const state = {
  photos: [], 
  assignments: Array(8).fill(null), // Logical pages 1..8
  viewMode: 'sheet', // 'sheet' | 'reader'
  paper: 'A4',
  objectFit: 'cover',
  margin: 5,
  gap: 0,
  borderWidth: 0.3,
  borderColor: '#222222',
  pageBg: '#ffffff',
  guides: 'yes'
};

const paperDimensionsMM = {
  "A4": [297, 210], // Landscape dimensions
  "A3": [420, 297],
  "US Letter": [279.4, 215.9]
};

// 8-page mini-zine imposition mapping
// Standard 8-page mini zine: 2 rows x 4 columns on a single landscape sheet
// Row 1 (Top, upside down): [ Logical 5, Logical 4, Logical 3, Logical 6 ]
// Row 2 (Bottom, right side up): [ Logical 8 (Back), Logical 1 (Front), Logical 2, Logical 7 ]
const zineSheetLayout = [
  { logical: 5, rotate: 180, col: 0, row: 0 },
  { logical: 4, rotate: 180, col: 1, row: 0 },
  { logical: 3, rotate: 180, col: 2, row: 0 },
  { logical: 6, rotate: 180, col: 3, row: 0 },
  { logical: 8, rotate: 0,   col: 0, row: 1 },
  { logical: 1, rotate: 0,   col: 1, row: 1 },
  { logical: 2, rotate: 0,   col: 2, row: 1 },
  { logical: 7, rotate: 0,   col: 3, row: 1 }
];

function init() {
  bindEvents();
  renderPageGrid();
  renderPreview();
}

function bindEvents() {
  $("pickBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = e => handleFiles([...e.target.files]);
  
  const drop = $("drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("drag"); };
  drop.ondragleave = () => drop.classList.remove("drag");
  drop.ondrop = e => {
    e.preventDefault();
    drop.classList.remove("drag");
    handleFiles([...e.dataTransfer.files].filter(f => f.type.startsWith("image/")));
  };

  $("clearPhotos").onclick = () => {
    state.photos.forEach(p => URL.revokeObjectURL(p.url));
    state.photos = [];
    state.assignments.fill(null);
    renderPageGrid();
    renderPreview();
  };

  $("autoAssign").onclick = () => {
    state.photos.forEach((ph, i) => {
      if (i < 8) state.assignments[i] = ph.id;
    });
    renderPageGrid();
    renderPreview();
  };

  $("paper").onchange = e => { state.paper = e.target.value; renderPreview(); };
  $("objectFit").onchange = e => { state.objectFit = e.target.value; renderPreview(); };
  $("margin").oninput = e => { state.margin = +e.target.value || 0; renderPreview(); };
  $("gap").oninput = e => { state.gap = +e.target.value || 0; renderPreview(); };
  $("borderWidth").oninput = e => { state.borderWidth = +e.target.value || 0; renderPreview(); };
  $("borderColor").oninput = e => { state.borderColor = e.target.value; renderPreview(); };
  $("pageBg").oninput = e => { state.pageBg = e.target.value; renderPreview(); };
  $("guides").onchange = e => { state.guides = e.target.value; renderPreview(); };

  $("viewSheet").onclick = () => setViewMode('sheet');
  $("viewReader").onclick = () => setViewMode('reader');

  $("printBtn").onclick = () => window.print();
  $("pngBtn").onclick = exportHighResPNG;
  $("jsonOut").onclick = exportJSON;
  $("jsonIn").onclick = () => $("jsonInput").click();
  $("jsonInput").onchange = e => importJSONFile(e.target.files[0]);

  window.addEventListener("resize", renderPreview);
}

function setViewMode(mode) {
  state.viewMode = mode;
  $("viewSheet").classList.toggle("active", mode === 'sheet');
  $("viewReader").classList.toggle("active", mode === 'reader');
  renderPreview();
}

async function handleFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.src = url;
    await new Promise(r => { img.onload = r; });
    
    const photoObj = { id: crypto.randomUUID(), name: f.name, url, img };
    state.photos.push(photoObj);

    // Auto-fill first empty assignment slot
    const emptyIdx = state.assignments.findIndex(x => x === null);
    if (emptyIdx !== -1) state.assignments[emptyIdx] = photoObj.id;
  }
  renderPageGrid();
  renderPreview();
}

function renderPageGrid() {
  const container = $("pageGrid");
  container.innerHTML = "";

  for (let i = 0; i < 8; i++) {
    const logicalNum = i + 1;
    const card = document.createElement("div");
    card.className = "page-card";

    const assignedId = state.assignments[i];
    const photo = state.photos.find(p => p.id === assignedId);

    card.innerHTML = `
      <div class="header">
        <span>Page ${logicalNum} ${logicalNum === 1 ? '(Cover)' : logicalNum === 8 ? '(Back)' : ''}</span>
      </div>
      <div class="thumb-box">
        ${photo ? `<img src="${photo.url}">` : `<span style="font-size:10px;color:#666">Empty</span>`}
      </div>
      <select class="photo-select">
        <option value="">-- Blank Page --</option>
        ${state.photos.map(p => `<option value="${p.id}" ${p.id === assignedId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
      </select>
    `;

    const select = card.querySelector(".photo-select");
    select.onchange = e => {
      state.assignments[i] = e.target.value || null;
      renderPageGrid();
      renderPreview();
    };

    container.appendChild(card);
  }
}

function renderPreview() {
  const preview = $("paperPreview");
  preview.innerHTML = "";

  if (state.viewMode === 'sheet') {
    renderSheetPreview(preview);
  } else {
    renderReaderPreview(preview);
  }
}

function renderSheetPreview(container) {
  const [mmW, mmH] = paperDimensionsMM[state.paper];
  const scale = Math.min(($("preview-wrap").clientWidth - 60) / mmW, ($("preview-wrap").clientHeight - 60) / mmH, 2.5);
  
  const width = mmW * scale;
  const height = mmH * scale;

  container.style.width = width + "px";
  container.style.height = height + "px";
  container.style.setProperty('--page-bg', state.pageBg);

  const colW = width / 4;
  const rowH = height / 2;

  zineSheetLayout.forEach(slot => {
    const pageDiv = document.createElement("div");
    pageDiv.className = `page ${slot.rotate === 180 ? 'flipped' : ''}`;
    
    const marginPx = (state.margin / mmW) * width;
    const gapPx = (state.gap / mmW) * width;

    pageDiv.style.left = (slot.col * colW + gapPx / 2) + "px";
    pageDiv.style.top = (slot.row * rowH + gapPx / 2) + "px";
    pageDiv.style.width = (colW - gapPx) + "px";
    pageDiv.style.height = (rowH - gapPx) + "px";

    const assignedId = state.assignments[slot.logical - 1];
    const photo = state.photos.find(p => p.id === assignedId);

    if (photo) {
      const img = document.createElement("img");
      img.src = photo.url;
      img.className = `fit-${state.objectFit}`;
      pageDiv.appendChild(img);
    } else {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = `<div>P${slot.logical}</div>`;
      pageDiv.appendChild(empty);
    }

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = `P${slot.logical}`;
    pageDiv.appendChild(label);

    const border = document.createElement("div");
    border.className = "border-overlay";
    border.style.border = `${state.borderWidth * scale}px solid ${state.borderColor}`;
    pageDiv.appendChild(border);

    container.appendChild(pageDiv);
  });

  if (state.guides === 'yes') {
    // Vertical folds
    for (let i = 1; i < 4; i++) {
      const vFold = document.createElement("div");
      vFold.className = "foldline v";
      vFold.style.left = (i * colW) + "px";
      container.appendChild(vFold);
    }
    // Horizontal fold
    const hFold = document.createElement("div");
    hFold.className = "foldline h";
    hFold.style.top = rowH + "px";
    container.appendChild(hFold);

    // Center Slit Cut line (between middle columns)
    const cut = document.createElement("div");
    cut.className = "cutline";
    cut.style.left = colW + "px";
    cut.style.width = (colW * 2) + "px";
    cut.style.top = rowH + "px";
    container.appendChild(cut);
  }
}

function renderReaderPreview(container) {
  // Simple reader view displaying pages sequentially side by side
  container.style.width = "600px";
  container.style.height = "400px";
  container.style.background = "#1a1a1e";
  container.style.display = "flex";
  container.style.alignItems = "center";
  container.style.justifyContent = "center";
  container.style.color = "#aaa";
  container.innerHTML = `<div style="text-align:center"><h3>Reader Spread Preview</h3><p>Page 8 (Back) | Page 1 (Cover)</p></div>`;
}

function renderCanvas(scaleFactor = 1) {
  const [mmW, mmH] = paperDimensionsMM[state.paper];
  const dpi = 300 * scaleFactor;
  const mmToPx = dpi / 25.4;

  const canvas = document.createElement("canvas");
  canvas.width = Math.round(mmW * mmToPx);
  canvas.height = Math.round(mmH * mmToPx);

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = state.pageBg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const colW = canvas.width / 4;
  const rowH = canvas.height / 2;

  zineSheetLayout.forEach(slot => {
    const x = slot.col * colW;
    const y = slot.row * rowH;

    const assignedId = state.assignments[slot.logical - 1];
    const photo = state.photos.find(p => p.id === assignedId);

    ctx.save();
    ctx.translate(x + colW / 2, y + rowH / 2);
    if (slot.rotate) ctx.rotate((slot.rotate * Math.PI) / 180);

    const drawW = colW - (state.gap * mmToPx);
    const drawH = rowH - (state.gap * mmToPx);

    if (photo) {
      const img = photo.img;
      let nw = img.naturalWidth, nh = img.naturalHeight;
      let renderW = drawW, renderH = drawH;

      if (state.objectFit === 'cover') {
        const ratio = Math.max(drawW / nw, drawH / nh);
        renderW = nw * ratio;
        renderH = nh * ratio;
      } else {
        const ratio = Math.min(drawW / nw, drawH / nh);
        renderW = nw * ratio;
        renderH = nh * ratio;
      }

      ctx.beginPath();
      ctx.rect(-drawW / 2, -drawH / 2, drawW, drawH);
      ctx.clip();
      ctx.drawImage(img, -renderW / 2, -renderH / 2, renderW, renderH);
    }

    if (state.borderWidth > 0) {
      ctx.strokeStyle = state.borderColor;
      ctx.lineWidth = state.borderWidth * mmToPx;
      ctx.strokeRect(-drawW / 2, -drawH / 2, drawW, drawH);
    }

    ctx.restore();
  });

  return canvas;
}

function exportHighResPNG() {
  const canvas = renderCanvas(1);
  canvas.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `zine-imposition-${state.paper}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}

function exportJSON() {
  const data = {
    app: "Zine Studio",
    version: 2,
    state: {
      paper: state.paper,
      objectFit: state.objectFit,
      margin: state.margin,
      gap: state.gap,
      borderWidth: state.borderWidth,
      borderColor: state.borderColor,
      pageBg: state.pageBg,
      assignments: state.assignments
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "zine-config.json";
  a.click();
}

async function importJSONFile(file) {
  if (!file) return;
  try {
    const content = await file.text();
    const parsed = JSON.parse(content);
    if (parsed.state) {
      Object.assign(state, parsed.state);
      renderPageGrid();
      renderPreview();
    }
  } catch (err) {
    alert("Failed to load project config.");
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
}

window.onload = init;
</script>
</body>
</html>
