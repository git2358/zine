<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One-Sheet Zine Studio</title>
<style>
:root {
  --bg: #171717; --panel: #222222; --line: #444444;
  --text: #f4f4f4; --muted: #aaaaaa; --accent: #4f80ff; --accent-hover: #6692ff;
  --danger: #e5484d; --paper: #ffffff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100vh; }
button, input, select { font: inherit; }
button { border: 1px solid #555; background: #333; color: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: all 0.15s ease; }
button:hover { background: #3d3d3d; border-color: #666; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent-hover); }
button.danger { background: rgba(229, 72, 77, 0.2); border-color: var(--danger); color: var(--danger); }
button.danger:hover { background: var(--danger); color: #fff; }
button.small { padding: 4px 8px; font-size: 0.78rem; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 100vh; }
.preview-area { min-width: 0; display: flex; flex-direction: column; background: #0c0c0e; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.topbar h1 { font-size: 1rem; margin: 0; font-weight: 600; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.preview-wrap { padding: 20px; overflow: auto; flex: 1; display: flex; justify-content: center; align-items: center; }
#paperPreview { position: relative; background: var(--paper); box-shadow: 0 12px 40px rgba(0,0,0,0.6); overflow: hidden; }
.page { position: absolute; overflow: hidden; background: var(--page-bg, #fff); box-sizing: border-box; }
.page.flipped { transform: rotate(180deg); }
.page-inner { width: 100%; height: 100%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.page img { width: 100%; height: 100%; display: block; }
.page img.fit-cover { object-fit: cover; }
.page img.fit-contain { object-fit: contain; }
.page img.fit-fill { object-fit: fill; }
.page .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 11px; text-align: center; padding: 4px; border: 1px dashed #ccc; margin: 2px; }
.page .border-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.page .label { position: absolute; left: 3px; top: 3px; font-size: 9px; font-weight: 700; color: #333; background: rgba(255,255,255,0.85); padding: 1px 3px; border-radius: 3px; z-index: 5; border: 1px solid #ddd; }
.diagonal-cross { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0.35; }
.diagonal-cross svg { width: 100%; height: 100%; }

.foldline { position: absolute; z-index: 6; pointer-events: none; }
.foldline.v { top: 0; bottom: 0; border-left: 1px dashed #4f80ff; }
.foldline.h { left: 0; right: 0; border-top: 1px dashed #4f80ff; }
.foldline.spine { border-color: #e5484d; border-style: solid; opacity: 0.7; }

.sidebar { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; }
.section { padding: 16px; border-bottom: 1px solid var(--line); }
.section h2 { font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { margin-bottom: 10px; }
.field label { display: block; color: var(--muted); font-size: 0.78rem; margin-bottom: 5px; }
.field input[type=text], .field input[type=number], .field select { width: 100%; background: #151515; color: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.field input[type=color] { width: 100%; height: 34px; background: #151515; border: 1px solid var(--line); border-radius: 6px; padding: 2px; cursor: pointer; }
.drop { border: 2px dashed #555; border-radius: 10px; padding: 16px; text-align: center; color: var(--muted); background: rgba(0,0,0,0.15); }
.drop.drag { border-color: var(--accent); background: rgba(79, 128, 255, 0.1); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.page-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
.page-card { background: #181818; border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.page-card .header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.page-card .thumb-box { height: 60px; background: #000; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #333; position: relative; }
.page-card .thumb-box img { width: 100%; height: 100%; }
.page-card select { font-size: 0.72rem; padding: 3px 5px; width: 100%; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; }

.help { font-size: 0.75rem; color: var(--muted); line-height: 1.4; margin-top: 4px; }
.status { font-size: 0.78rem; color: var(--muted); }

@media(max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { border-left: 0; border-top: 1px solid var(--line); }
  .preview-wrap { min-height: 420px; padding: 12px; }
}
</style>
</head>
<body>
<div class="app">
  <main class="preview-area">
    <div class="topbar">
      <h1>One-Sheet Zine Studio</h1>
      <div class="spacer"></div>
      <button id="printBtn" class="primary">Print / Save PDF</button>
    </div>
    <div id="previewWrap" class="preview-wrap">
      <div id="paperPreview"></div>
    </div>
  </main>

  <aside class="sidebar">
    <div class="section">
      <h2>1. Media Assets</h2>
      <div id="drop" class="drop">
        Drag & Drop Images<br><small>or</small><br>
        <button id="pickBtn" class="primary small" style="margin-top:6px">Select Files</button>
      </div>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
      <div class="actions" style="margin-top:10px">
        <button id="clearPhotos" class="small danger">Clear All</button>
        <button id="autoAssign" class="small">Auto Fill</button>
      </div>
    </div>

    <div class="section">
      <h2>2. Zine & Paper Setup</h2>
      <div class="grid2">
        <div class="field">
          <label>Layout Mode</label>
          <select id="pageCount">
            <option value="16" selected>16 Images (4×4 Grid)</option>
            <option value="8">8 Images (2×4 Grid)</option>
          </select>
        </div>
        <div class="field">
          <label>Sheet Orientation</label>
          <select id="sheetOrientation">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Paper Size</label>
          <select id="paper"><option value="A4">A4</option><option value="A3">A3</option><option value="US Letter">US Letter</option></select>
        </div>
        <div class="field">
          <label>Global Image Fit</label>
          <select id="objectFit"><option value="cover">Crop / Fill (Cover)</option><option value="contain">Fit Whole (Contain)</option><option value="fill">Stretch to Fill</option></select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Outer Margin (mm)</label>
          <input id="margin" type="number" min="0" max="30" step="0.5" value="4">
        </div>
        <div class="field">
          <label>Spine Gap (mm)</label>
          <input id="spineGap" type="number" min="0" max="25" step="0.5" value="5">
        </div>
      </div>
    </div>

    <div class="section">
      <h2>3. Styling & Guides</h2>
      <div class="grid2">
        <div class="field">
          <label>Border Width (mm)</label>
          <input id="borderWidth" type="number" min="0" max="5" step="0.1" value="0.3">
        </div>
        <div class="field">
          <label>Border Color</label>
          <input id="borderColor" type="color" value="#ffffff">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Page Background</label>
          <input id="pageBg" type="color" value="#ffffff">
        </div>
        <div class="field">
          <label>Fold & Cross Guides</label>
          <select id="guides"><option value="yes">Show Guides</option><option value="no">Hide Guides</option></select>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>4. Individual Page Controls</h2>
      <div class="help" style="margin-bottom:10px">Customize per-page photo assignment, rotation angle, and image framing fit.</div>
      <div id="pageGrid" class="page-grid"></div>
    </div>

    <div class="section">
      <h2>5. Export Options</h2>
      <div class="actions">
        <button id="pngBtn" class="primary">Export PNG (300 DPI)</button>
        <button id="jsonOut">Save Settings</button>
        <button id="jsonIn">Load Settings</button>
        <input id="jsonInput" type="file" accept=".json" hidden>
      </div>
      <div id="status" class="status" style="margin-top:10px">Ready.</div>
    </div>
  </aside>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const state = {
  photos: [],
  pageCount: 16,
  sheetOrientation: 'portrait',
  assignments: Array(16).fill(null),
  pageMeta: Array(16).fill(null).map(() => ({ rotate: 0, fit: 'global' })),
  paper: 'A4',
  objectFit: 'cover',
  margin: 4,
  spineGap: 5,
  borderWidth: 0.3,
  borderColor: '#ffffff',
  pageBg: '#ffffff',
  guides: 'yes'
};

const paperDimensionsMM = {
  "A4": [210, 297],
  "A3": [297, 420],
  "US Letter": [215.9, 279.4]
};

const oneSheetLayouts = {
  8: {
    cols: 4, rows: 2,
    slots: [
      { logical: 5, rotate: 180, col: 0, row: 0 },
      { logical: 4, rotate: 180, col: 1, row: 0 },
      { logical: 3, rotate: 180, col: 2, row: 0 },
      { logical: 6, rotate: 180, col: 3, row: 0 },
      { logical: 8, rotate: 0,   col: 0, row: 1 },
      { logical: 1, rotate: 0,   col: 1, row: 1 },
      { logical: 2, rotate: 0,   col: 2, row: 1 },
      { logical: 7, rotate: 0,   col: 3, row: 1 }
    ]
  },
  16: {
    cols: 4, rows: 4,
    slots: [
      { logical: 14, rotate: 180, col: 0, row: 0 },
      { logical: 13, rotate: 180, col: 1, row: 0 },
      { logical: 12, rotate: 180, col: 2, row: 0 },
      { logical: 11, rotate: 180, col: 3, row: 0 },

      { logical: 7,  rotate: 0,   col: 0, row: 1 },
      { logical: 8,  rotate: 0,   col: 1, row: 1 },
      { logical: 9,  rotate: 0,   col: 2, row: 1 },
      { logical: 10, rotate: 0,   col: 3, row: 1 },

      { logical: 6,  rotate: 180, col: 0, row: 2 },
      { logical: 5,  rotate: 180, col: 1, row: 2 },
      { logical: 4,  rotate: 180, col: 2, row: 2 },
      { logical: 3,  rotate: 180, col: 3, row: 2 },

      { logical: 16, rotate: 0,   col: 0, row: 3, customLabel: 'BACK COVER' },
      { logical: 1,  rotate: 0,   col: 1, row: 3, customLabel: 'FRONT COVER' },
      { logical: 2,  rotate: 0,   col: 2, row: 3, customLabel: '1' },
      { logical: 15, rotate: 0,   col: 3, row: 3, customLabel: '2' }
    ]
  }
};

function init() {
  bindEvents();
  renderPageGrid();
  renderPreview();
}

function bindEvents() {
  $("pickBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = e => handleFiles([...e.target.files]);
  
  const drop = $("drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("drag"); };
  drop.ondragleave = () => drop.classList.remove("drag");
  drop.ondrop = e => {
    e.preventDefault();
    drop.classList.remove("drag");
    handleFiles([...e.dataTransfer.files].filter(f => f.type.startsWith("image/")));
  };

  $("clearPhotos").onclick = () => {
    state.photos.forEach(p => URL.revokeObjectURL(p.url));
    state.photos = [];
    state.assignments.fill(null);
    renderPageGrid();
    renderPreview();
  };

  $("autoAssign").onclick = () => {
    state.photos.forEach((ph, i) => {
      if (i < state.pageCount) state.assignments[i] = ph.id;
    });
    renderPageGrid();
    renderPreview();
  };

  $("pageCount").onchange = e => {
    state.pageCount = parseInt(e.target.value, 10);
    state.assignments = Array(state.pageCount).fill(null);
    state.pageMeta = Array(state.pageCount).fill(null).map(() => ({ rotate: 0, fit: 'global' }));
    renderPageGrid();
    renderPreview();
  };

  $("sheetOrientation").onchange = e => { state.sheetOrientation = e.target.value; renderPreview(); };
  $("paper").onchange = e => { state.paper = e.target.value; renderPreview(); };
  $("objectFit").onchange = e => { state.objectFit = e.target.value; renderPreview(); };
  $("margin").oninput = e => { state.margin = +e.target.value || 0; renderPreview(); };
  $("spineGap").oninput = e => { state.spineGap = +e.target.value || 0; renderPreview(); };
  $("borderWidth").oninput = e => { state.borderWidth = +e.target.value || 0; renderPreview(); };
  $("borderColor").oninput = e => { state.borderColor = e.target.value; renderPreview(); };
  $("pageBg").oninput = e => { state.pageBg = e.target.value; renderPreview(); };
  $("guides").onchange = e => { state.guides = e.target.value; renderPreview(); };

  $("printBtn").onclick = () => window.print();
  $("pngBtn").onclick = exportPNG;
  $("jsonOut").onclick = exportJSON;
  $("jsonIn").onclick = () => $("jsonInput").click();
  $("jsonInput").onchange = e => importJSONFile(e.target.files[0]);

  window.addEventListener("resize", renderPreview);
}

async function handleFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.src = url;
    await new Promise(r => { img.onload = r; });
    
    const photoObj = { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), name: f.name, url, img };
    state.photos.push(photoObj);

    const emptyIdx = state.assignments.findIndex(x => x === null);
    if (emptyIdx !== -1) state.assignments[emptyIdx] = photoObj.id;
  }
  renderPageGrid();
  renderPreview();
}

function renderPageGrid() {
  const container = $("pageGrid");
  container.innerHTML = "";

  for (let i = 0; i < state.pageCount; i++) {
    const logicalNum = i + 1;
    const card = document.createElement("div");
    card.className = "page-card";

    const assignedId = state.assignments[i];
    const photo = state.photos.find(p => p.id === assignedId);
    const meta = state.pageMeta[i] || { rotate: 0, fit: 'global' };
    const effectiveFit = meta.fit === 'global' ? state.objectFit : meta.fit;

    let tag = '';
    if (logicalNum === 1) tag = ' (Front Cover)';
    else if (logicalNum === state.pageCount) tag = ' (Back Cover)';

    card.innerHTML = `
      <div class="header">
        <span>Page ${logicalNum}${tag}</span>
      </div>
      <div class="thumb-box">
        ${photo ? `<img src="${photo.url}" class="fit-${effectiveFit}" style="transform: rotate(${meta.rotate}deg);">` : `<span style="font-size:10px;color:#666">Empty</span>`}
      </div>
      <select class="photo-select">
        <option value="">-- Blank --</option>
        ${state.photos.map(p => `<option value="${p.id}" ${p.id === assignedId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
      </select>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">
        <select class="rot-select">
          <option value="0" ${meta.rotate === 0 ? 'selected' : ''}>Rot: 0°</option>
          <option value="90" ${meta.rotate === 90 ? 'selected' : ''}>Rot: 90°</option>
          <option value="180" ${meta.rotate === 180 ? 'selected' : ''}>Rot: 180°</option>
          <option value="270" ${meta.rotate === 270 ? 'selected' : ''}>Rot: 270°</option>
        </select>
        <select class="fit-select">
          <option value="global" ${meta.fit === 'global' ? 'selected' : ''}>Fit: Auto</option>
          <option value="cover" ${meta.fit === 'cover' ? 'selected' : ''}>Fit: Crop</option>
          <option value="contain" ${meta.fit === 'contain' ? 'selected' : ''}>Fit: Fit</option>
          <option value="fill" ${meta.fit === 'fill' ? 'selected' : ''}>Fit: Stretch</option>
        </select>
      </div>
    `;

    card.querySelector(".photo-select").onchange = e => {
      state.assignments[i] = e.target.value || null;
      renderPageGrid(); renderPreview();
    };
    card.querySelector(".rot-select").onchange = e => {
      state.pageMeta[i].rotate = parseInt(e.target.value, 10);
      renderPageGrid(); renderPreview();
    };
    card.querySelector(".fit-select").onchange = e => {
      state.pageMeta[i].fit = e.target.value;
      renderPageGrid(); renderPreview();
    };

    container.appendChild(card);
  }
}

function renderPreview() {
  const container = $("paperPreview");
  const wrap = $("previewWrap");
  container.innerHTML = "";

  const dim = paperDimensionsMM[state.paper];
  const mmW = state.sheetOrientation === 'portrait' ? dim[0] : dim[1];
  const mmH = state.sheetOrientation === 'portrait' ? dim[1] : dim[0];

  const maxW = wrap.clientWidth - 40;
  const maxH = wrap.clientHeight - 40;

  const scale = Math.min(maxW / mmW, maxH / mmH, 2.2);
  const width = mmW * scale;
  const height = mmH * scale;

  container.style.width = width + "px";
  container.style.height = height + "px";
  container.style.setProperty('--page-bg', state.pageBg);

  const layout = oneSheetLayouts[state.pageCount];
  const colW = width / layout.cols;
  const rowH = height / layout.rows;
  const spinePx = (state.spineGap / mmW) * width;

  layout.slots.forEach(slot => {
    const pageDiv = document.createElement("div");
    pageDiv.className = `page ${slot.rotate === 180 ? 'flipped' : ''}`;
    
    let leftPos = slot.col * colW;
    let cellW = colW;

    if (slot.col === 0 && slot.row === 3) {
      cellW = colW + spinePx;
    } else if (slot.col > 0 && slot.row === 3) {
      leftPos += spinePx;
    }

    pageDiv.style.left = leftPos + "px";
    pageDiv.style.top = (slot.row * rowH) + "px";
    pageDiv.style.width = cellW + "px";
    pageDiv.style.height = rowH + "px";
    pageDiv.style.padding = (state.margin / mmW * width) + "px";

    const assignedId = state.assignments[slot.logical - 1];
    const photo = state.photos.find(p => p.id === assignedId);
    const meta = state.pageMeta[slot.logical - 1] || { rotate: 0, fit: 'global' };
    const effectiveFit = meta.fit === 'global' ? state.objectFit : meta.fit;

    if (photo) {
      const inner = document.createElement("div");
      inner.className = "page-inner";

      const img = document.createElement("img");
      img.src = photo.url;
      img.className = `fit-${effectiveFit}`;
      if (meta.rotate !== 0) img.style.transform = `rotate(${meta.rotate}deg)`;

      inner.appendChild(img);
      pageDiv.appendChild(inner);
    } else {
      const empty = document.createElement("div");
      empty.className = "empty";
      const lblText = slot.customLabel || `Page ${slot.logical}`;
      empty.innerHTML = `<div>${lblText}</div>`;
      pageDiv.appendChild(empty);
    }

    if (state.guides === 'yes') {
      const cross = document.createElement("div");
      cross.className = "diagonal-cross";
      cross.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="#aaa" stroke-width="0.5"/><line x1="100" y1="0" x2="0" y2="100" stroke="#aaa" stroke-width="0.5"/></svg>`;
      pageDiv.appendChild(cross);
    }

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = slot.customLabel ? slot.customLabel : `P${slot.logical}`;
    pageDiv.appendChild(label);

    if (state.borderWidth > 0) {
      const border = document.createElement("div");
      border.className = "border-overlay";
      border.style.border = `${state.borderWidth * scale}px solid ${state.borderColor}`;
      pageDiv.appendChild(border);
    }

    container.appendChild(pageDiv);
  });

  if (state.guides === 'yes') {
    for (let c = 1; c < layout.cols; c++) {
      const vFold = document.createElement("div");
      vFold.className = "foldline v";
      vFold.style.left = (c * colW) + "px";
      container.appendChild(vFold);
    }
    for (let r = 1; r < layout.rows; r++) {
      const hFold = document.createElement("div");
      hFold.className = "foldline h";
      hFold.style.top = (r * rowH) + "px";
      container.appendChild(hFold);
    }
    if (spinePx > 0) {
      const spineFold = document.createElement("div");
      spineFold.className = "foldline v spine";
      spineFold.style.left = (colW + spinePx) + "px";
      container.appendChild(spineFold);
    }
  }
}

function exportPNG() {
  const dim = paperDimensionsMM[state.paper];
  const mmW = state.sheetOrientation === 'portrait' ? dim[0] : dim[1];
  const mmH = state.sheetOrientation === 'portrait' ? dim[1] : dim[0];

  const dpi = 300;
  const mmToPx = dpi / 25.4;

  const canvas = document.createElement("canvas");
  canvas.width = Math.round(mmW * mmToPx);
  canvas.height = Math.round(mmH * mmToPx);

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = state.pageBg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const layout = oneSheetLayouts[state.pageCount];
  const colW = canvas.width / layout.cols;
  const rowH = canvas.height / layout.rows;
  const spinePx = state.spineGap * mmToPx;

  layout.slots.forEach(slot => {
    let x = slot.col * colW;
    let widthPx = colW;

    if (slot.col === 0 && slot.row === 3) {
      widthPx = colW + spinePx;
    } else if (slot.col > 0 && slot.row === 3) {
      x += spinePx;
    }

    const y = slot.row * rowH;

    const assignedId = state.assignments[slot.logical - 1];
    const photo = state.photos.find(p => p.id === assignedId);
    const meta = state.pageMeta[slot.logical - 1] || { rotate: 0, fit: 'global' };
    const effectiveFit = meta.fit === 'global' ? state.objectFit : meta.fit;

    const marginPx = state.margin * mmToPx;
    const drawW = widthPx - (marginPx * 2);
    const drawH = rowH - (marginPx * 2);

    ctx.save();
    ctx.translate(x + widthPx / 2, y + rowH / 2);
    if (slot.rotate) ctx.rotate((slot.rotate * Math.PI) / 180);

    if (photo) {
      ctx.save();
      if (meta.rotate) ctx.rotate((meta.rotate * Math.PI) / 180);

      const img = photo.img;
      const rot = (meta.rotate % 180 !== 0);
      const nw = rot ? img.naturalHeight : img.naturalWidth;
      const nh = rot ? img.naturalWidth : img.naturalHeight;

      let renderW = drawW, renderH = drawH;

      if (effectiveFit === 'cover') {
        const ratio = Math.max(drawW / nw, drawH / nh);
        renderW = nw * ratio; renderH = nh * ratio;
      } else if (effectiveFit === 'contain') {
        const ratio = Math.min(drawW / nw, drawH / nh);
        renderW = nw * ratio; renderH = nh * ratio;
      }

      ctx.beginPath();
      ctx.rect(-drawW / 2, -drawH / 2, drawW, drawH);
      ctx.clip();

      if (rot) {
        ctx.drawImage(img, -renderH / 2, -renderW / 2, renderH, renderW);
      } else {
        ctx.drawImage(img, -renderW / 2, -renderH / 2, renderW, renderH);
      }
      ctx.restore();
    }

    if (state.borderWidth > 0) {
      ctx.strokeStyle = state.borderColor;
      ctx.lineWidth = state.borderWidth * mmToPx;
      ctx.strokeRect(-drawW / 2, -drawH / 2, drawW, drawH);
    }

    ctx.restore();
  });

  canvas.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `zine-${state.pageCount}pages-${state.sheetOrientation}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}

function exportJSON() {
  const data = {
    app: "One-Sheet Zine Studio",
    version: 7,
    state: {
      pageCount: state.pageCount,
      sheetOrientation: state.sheetOrientation,
      paper: state.paper,
      objectFit: state.objectFit,
      margin: state.margin,
      spineGap: state.spineGap,
      borderWidth: state.borderWidth,
      borderColor: state.borderColor,
      pageBg: state.pageBg,
      assignments: state.assignments,
      pageMeta: state.pageMeta
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "zine-settings.json";
  a.click();
}

async function importJSONFile(file) {
  if (!file) return;
  try {
    const content = await file.text();
    const parsed = JSON.parse(content);
    if (parsed.state) {
      Object.assign(state, parsed.state);
      $("pageCount").value = state.pageCount;
      $("sheetOrientation").value = state.sheetOrientation || 'portrait';
      $("paper").value = state.paper;
      $("objectFit").value = state.objectFit;
      $("margin").value = state.margin;
      if (state.spineGap !== undefined) $("spineGap").value = state.spineGap;
      $("borderWidth").value = state.borderWidth;
      $("borderColor").value = state.borderColor;
      $("pageBg").value = state.pageBg;
      renderPageGrid();
      renderPreview();
    }
  } catch (err) {
    alert("Could not load configuration.");
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
}

window.onload = init;
