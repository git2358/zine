<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Photo Zine Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #007acc;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Controls */
        #sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .sidebar-header {
            padding: 16px;
            background-color: #252526;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .sidebar-content {
            padding: 16px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #252526;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .control-group h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 4px;
        }

        label {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="number"], select, input[type="color"], input[type="file"] {
            background: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            width: 100%;
        }

        input[type="range"] {
            width: 60%;
        }

        .inline-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .inline-label input[type="checkbox"] {
            width: auto;
        }

        /* Page Slot Assignment Panel */
        .page-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            background: #1a1a1a;
            padding: 8px;
            border-radius: 4px;
        }

        .page-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a2a2a;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .page-item select {
            flex-grow: 1;
        }

        /* Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button, .file-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            transition: background 0.2s;
        }

        button:hover, .file-btn:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            background-color: #444;
        }

        input[type="file"].hidden-input {
            display: none;
        }

        /* Preview Workspace */
        #workspace {
            flex-grow: 1;
            background-color: #181818;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: auto;
            position: relative;
        }

        #canvas-container {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background: #fff;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
                overflow: auto;
            }
            #sidebar {
                width: 100%;
                height: 50vh;
            }
            #workspace {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR CONTROLS -->
    <div id="sidebar">
        <div class="sidebar-header">Zine Layout Studio</div>
        <div class="sidebar-content">

            <!-- 1. Media Upload -->
            <div class="control-group">
                <h3>1. Photos & Project</h3>
                <label class="file-btn">
                    📷 Load Images
                    <input type="file" id="imageInput" multiple accept="image/*" class="hidden-input">
                </label>
                <div class="btn-grid">
                    <label class="file-btn btn-secondary">
                        📥 Import JSON
                        <input type="file" id="jsonInput" accept=".json" class="hidden-input">
                    </label>
                    <button class="btn-secondary" onclick="exportJSON()">📤 Export JSON</button>
                </div>
            </div>

            <!-- 2. Format & Layout Config -->
            <div class="control-group">
                <h3>2. Print Settings</h3>
                <label>Paper Format
                    <select id="paperSize" onchange="render()">
                        <option value="a4">A4 (297 × 210 mm)</option>
                        <option value="a3">A3 (420 × 297 mm)</option>
                        <option value="letter">US Letter (11 × 8.5 in)</option>
                    </select>
                </label>
                <label>Page Orientation
                    <select id="zineOrientation" onchange="render()">
                        <option value="portrait">Portrait Pages</option>
                        <option value="landscape">Landscape Pages</option>
                    </select>
                </label>
                <label>Pages per Sheet
                    <select id="pageCount" onchange="updatePageSlots(); render();">
                        <option value="8">8 Pages (1 Sheet)</option>
                        <option value="16">16 Pages (1 Sheet Folding)</option>
                    </select>
                </label>
            </div>

            <!-- 3. Styling & Margins -->
            <div class="control-group">
                <h3>3. Layout & Style Settings</h3>
                <label>Background Color
                    <input type="color" id="bgColor" value="#ffffff" onchange="render()">
                </label>
                <label>Outer Padding: <span id="paddingVal">10</span>px
                    <input type="range" id="padding" min="0" max="50" value="10" oninput="document.getElementById('paddingVal').innerText=this.value; render()">
                </label>
                <label>Image Spacing: <span id="spacingVal">5</span>px
                    <input type="range" id="spacing" min="0" max="30" value="5" oninput="document.getElementById('spacingVal').innerText=this.value; render()">
                </label>
                <label class="inline-label">
                    <input type="checkbox" id="enableSpine" onchange="render()">
                    <span>Include Folding Spine Gap Layout (Emon Hassan Style)</span>
                </label>
                <label>Spine Width Offset: <span id="spineVal">15</span>px
                    <input type="range" id="spineGap" min="0" max="60" value="15" oninput="document.getElementById('spineVal').innerText=this.value; render()">
                </label>
            </div>

            <!-- 4. Page Sequence and Panoramic Spans -->
            <div class="control-group">
                <h3>4. Page Ordering & Panoramas</h3>
                <p style="font-size: 0.75rem; color:#aaa;">Assign images to zine pages. Check "Panoramic Span" to strip inner borders with the adjacent page.</p>
                <div class="page-list" id="pageSlotContainer"></div>
            </div>

            <!-- 5. Exports -->
            <div class="control-group">
                <h3>5. Render & Export</h3>
                <div class="btn-grid">
                    <button onclick="exportImage('image/png')">Save PNG</button>
                    <button onclick="exportImage('image/tiff')">Save TIFF</button>
                </div>
            </div>

        </div>
    </div>

    <!-- LIVE PREVIEW CANVAS WORKSPACE -->
    <div id="workspace">
        <div id="canvas-container">
            <canvas id="zineCanvas"></canvas>
        </div>
    </div>

    <script>
        // Store state variables
        let uploadedImages = []; // Array of { id, name, src, imgObject }
        let pageSlots = [];      // Array of { pageNum, imageId, isFrontCover, isBackCover, isPanoramaNext }
        
        // Canvas Setup
        const canvas = document.getElementById('zineCanvas');
        const ctx = canvas.getContext('2d');

        // Dimensions setup in points/pixels for high-res render (300 DPI target)
        const paperDimensions = {
            'a4': { w: 3508, h: 2480 },
            'a3': { w: 4960, h: 3508 },
            'letter': { w: 3300, h: 2550 }
        };

        window.onload = () => {
            updatePageSlots();
            render();
        };

        // File Loading
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            let loadedCount = 0;

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const imgObj = {
                            id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                            name: file.name,
                            src: event.target.result,
                            element: img
                        };
                        uploadedImages.push(imgObj);
                        loadedCount++;
                        if (loadedCount === files.length) {
                            autoAssignImages();
                            updatePageSlots();
                            render();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        function updatePageSlots() {
            const count = parseInt(document.getElementById('pageCount').value);
            const newSlots = [];

            for (let i = 1; i <= count; i++) {
                const existing = pageSlots.find(s => s.pageNum === i);
                newSlots.push(existing || {
                    pageNum: i,
                    imageId: uploadedImages[i - 1] ? uploadedImages[i - 1].id : 'none',
                    isPanoramaNext: false
                });
            }
            pageSlots = newSlots;
            renderPageSlotsUI();
        }

        function autoAssignImages() {
            pageSlots.forEach((slot, idx) => {
                if (uploadedImages[idx]) {
                    slot.imageId = uploadedImages[idx].id;
                }
            });
        }

        function renderPageSlotsUI() {
            const container = document.getElementById('pageSlotContainer');
            container.innerHTML = '';

            pageSlots.forEach((slot, index) => {
                const div = document.createElement('div');
                div.className = 'page-item';

                let labelText = `Pg ${slot.pageNum}`;
                if (slot.pageNum === 1) labelText += " (Front Cover)";
                if (slot.pageNum === pageSlots.length) labelText += " (Back Cover)";

                let options = `<option value="none">-- Blank --</option>`;
                uploadedImages.forEach(img => {
                    const sel = img.id === slot.imageId ? 'selected' : '';
                    options += `<option value="${img.id}" ${sel}>${img.name}</option>`;
                });

                const panChecked = slot.isPanoramaNext ? 'checked' : '';
                const hidePan = (index === pageSlots.length - 1) ? 'style="display:none;"' : '';

                div.innerHTML = `
                    <span style="width: 100px;">${labelText}</span>
                    <select onchange="assignImageToPage(${slot.pageNum}, this.value)">${options}</select>
                    <label class="inline-label" ${hidePan} title="Connect borderlessly with Page ${slot.pageNum + 1}">
                        <input type="checkbox" ${panChecked} onchange="togglePanorama(${slot.pageNum}, this.checked)"> Panoramic Span ➔
                    </label>
                `;
                container.appendChild(div);
            });
        }

        function assignImageToPage(pageNum, imgId) {
            const slot = pageSlots.find(s => s.pageNum === pageNum);
            if (slot) slot.imageId = imgId;
            render();
        }

        function togglePanorama(pageNum, checked) {
            const slot = pageSlots.find(s => s.pageNum === pageNum);
            if (slot) slot.isPanoramaNext = checked;
            render();
        }

        // --- Core Rendering Engine ---
        function render() {
            const paperType = document.getElementById('paperSize').value;
            const dim = paperDimensions[paperType];
            
            canvas.width = dim.w;
            canvas.height = dim.h;

            const padding = parseInt(document.getElementById('padding').value) * 3;
            const spacing = parseInt(document.getElementById('spacing').value) * 2;
            const enableSpine = document.getElementById('enableSpine').checked;
            const spineGap = enableSpine ? parseInt(document.getElementById('spineGap').value) * 3 : 0;
            const bgColor = document.getElementById('bgColor').value;

            // Clear Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Print fold guidelines
            drawFoldLines();

            // 8-Page Standard One-Sheet Grid Layout Definition
            // Traditional 8-Page Fold Arrangement Map (Top row is upside down relative to paper):
            // Top Row (Rotated 180 deg): Page 10 (or 8), Page 1, Page 8 (Back Cover), Page 5 ...
            // Standard 8 Page single sheet order mapping across grid cells (2 rows x 4 cols):
            // Cell Layout:
            // [ Page 8 (Upside-Down) ][ Page 1 Front (Upside-Down) ][ Page 6 (Upside-Down) ][ Page 7 (Upside-Down) ]
            // [ Page 3               ][ Page 4                     ][ Page 5               ][ Page 2               ]
            
            const totalPages = parseInt(document.getElementById('pageCount').value);

            // Cell layout definition matrix: { cellX, cellY, pageNum, rotate180 }
            let layoutGrid = [];

            if (totalPages === 8) {
                layoutGrid = [
                    { col: 0, row: 0, pageNum: 8, rotate: true },
                    { col: 1, row: 0, pageNum: 1, rotate: true },
                    { col: 2, row: 0, pageNum: 6, rotate: true },
                    { col: 3, row: 0, pageNum: 5, rotate: true },
                    { col: 0, row: 1, pageNum: 7, rotate: false },
                    { col: 1, row: 1, pageNum: 2, rotate: false },
                    { col: 2, row: 1, pageNum: 3, rotate: false },
                    { col: 3, row: 1, pageNum: 4, rotate: false }
                ];
            } else {
                // 16-page grid layout option (4x4 arrangement)
                layoutGrid = [];
                let p = 1;
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        layoutGrid.push({ col: c, row: r, pageNum: p++, rotate: (r < 2) });
                    }
                }
            }

            const cols = totalPages === 8 ? 4 : 4;
            const rows = totalPages === 8 ? 2 : 4;

            const cellWidth = (canvas.width - (padding * 2)) / cols;
            const cellHeight = (canvas.height - (padding * 2)) / rows;

            layoutGrid.forEach(cell => {
                const slot = pageSlots.find(s => s.pageNum === cell.pageNum);
                if (!slot) return;

                const imgObj = uploadedImages.find(i => i.id === slot.imageId);

                // Compute Bounding Box for cell with spine & spacing
                let x = padding + cell.col * cellWidth;
                let y = padding + cell.row * cellHeight;
                let w = cellWidth;
                let h = cellHeight;

                // Apply Spine offset margins (shifting outer edge for spine wrap)
                if (enableSpine) {
                    if (cell.col < cols / 2) {
                        x += spineGap / 2;
                        w -= spineGap / 2;
                    } else {
                        w -= spineGap / 2;
                    }
                }

                // Check for Panorama seamlessly removing spacing between current and next page
                let applySpacingRight = true;
                if (slot.isPanoramaNext) {
                    applySpacingRight = false; // Disable right gap for panoramic span
                }

                // Inner spacing adjustments
                const padSpacing = spacing / 2;
                x += padSpacing;
                y += padSpacing;
                w -= applySpacingRight ? spacing : padSpacing;
                h -= spacing;

                if (imgObj && imgObj.element) {
                    drawPageImage(ctx, imgObj.element, x, y, w, h, cell.rotate);
                }

                // Page Label Guide on canvas (small light print)
                ctx.save();
                ctx.fillStyle = "rgba(150,150,150,0.5)";
                ctx.font = "24px sans-serif";
                ctx.fillText(`P.${cell.pageNum}`, x + 10, y + 30);
                ctx.restore();
            });
        }

        function drawPageImage(ctx, img, x, y, w, h, rotate180) {
            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            if (rotate180) {
                ctx.rotate(Math.PI);
            }

            // Calculate Object Fit Cover dimensions inside cell
            const imgAspect = img.width / img.height;
            const cellAspect = w / h;
            let drawW, drawH;

            if (imgAspect > cellAspect) {
                drawH = h;
                drawW = h * imgAspect;
            } else {
                drawW = w;
                drawH = w / imgAspect;
            }

            // Clip to cell boundary
            ctx.beginPath();
            ctx.rect(-w / 2, -h / 2, w, h);
            ctx.clip();

            // Draw image centered inside box
            ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.restore();
        }

        function drawFoldLines() {
            ctx.save();
            ctx.strokeStyle = "rgba(200, 200, 200, 0.4)";
            ctx.lineWidth = 3;
            ctx.setLineDash([15, 15]);

            // Draw center folding axes
            ctx.beginPath();
            // Vertical center fold
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            // Horizontal center fold
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            ctx.restore();
        }

        // --- Export Functions ---
        function exportImage(mimeType) {
            const link = document.createElement('a');
            const ext = mimeType === 'image/tiff' ? 'tiff' : 'png';
            link.download = `zine_layout_${Date.now()}.${ext}`;
            link.href = canvas.toDataURL(mimeType);
            link.click();
        }

        function exportJSON() {
            const exportData = {
                paperSize: document.getElementById('paperSize').value,
                zineOrientation: document.getElementById('zineOrientation').value,
                pageCount: document.getElementById('pageCount').value,
                bgColor: document.getElementById('bgColor').value,
                padding: document.getElementById('padding').value,
                spacing: document.getElementById('spacing').value,
                enableSpine: document.getElementById('enableSpine').checked,
                spineGap: document.getElementById('spineGap').value,
                pageSlots: pageSlots
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `zine_config_${Date.now()}.json`);
            dlAnchor.click();
        }

        document.getElementById('jsonInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.paperSize) document.getElementById('paperSize').value = data.paperSize;
                    if (data.zineOrientation) document.getElementById('zineOrientation').value = data.zineOrientation;
                    if (data.pageCount) document.getElementById('pageCount').value = data.pageCount;
                    if (data.bgColor) document.getElementById('bgColor').value = data.bgColor;
                    if (data.padding) document.getElementById('padding').value = data.padding;
                    if (data.spacing) document.getElementById('spacing').value = data.spacing;
                    if (data.enableSpine !== undefined) document.getElementById('enableSpine').checked = data.enableSpine;
                    if (data.spineGap) document.getElementById('spineGap').value = data.spineGap;
                    
                    if (data.pageSlots) pageSlots = data.pageSlots;

                    updatePageSlots();
                    render();
                } catch (err) {
                    alert("Invalid JSON file uploaded.");
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
